<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>答题 · 智盛杯 三套题库</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <a class="home" href="index.html">首页</a>
      <div class="title" id="paperTitle">模拟考试</div>
      <div class="progress" id="progress">已答 0/100</div>
    </div>
  </div>

  <div class="wrap">
    <div id="examView">
      <div class="rules" id="paperIntro" style="margin-top:14px"></div>
      <div id="sections"></div>
    </div>
    <div id="reviewView" hidden></div>
  </div>

  <div class="bottombar" id="bottombar" hidden>
    <div class="bottombar-inner">
      <div class="cnt" id="barCnt">已答 0 / 100</div>
      <button class="btn" id="submitBtn" type="button">提交答卷</button>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
